# Netlify 部署配置
# 网易云音乐音频代理服务

[build]
  # 不需要构建，直接部署静态文件和函数
  command = "echo 'Netlify Functions 部署完成'"
  publish = "."

# 重写规则：将 /audio/{song_id} 重写到函数
[[redirects]]
  from = "/audio/*"
  to = "/.netlify/functions/audio-proxy?song_id=:splat"
  status = 200
  force = true

# 首页重定向到 GitHub
[[redirects]]
  from = "/"
  to = "https://github.com/XiOuDi/163music-netlify-proxy"
  status = 302

# 函数配置
[functions]
  # 函数目录
  directory = "netlify/functions"
  # 注意：Netlify Functions 免费版默认超时10秒，无需在配置中设置
  # 如需修改超时，请在 Netlify Dashboard → Site settings → Functions 中设置
